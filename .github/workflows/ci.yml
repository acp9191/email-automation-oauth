name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite is built in from Node 24; there is no native module here.
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The suite needs no credentials and makes no network calls: fetch is
      # stubbed to throw, so an accidental request fails the test.
      - run: npm test
