services:
  automation:
    build: .
    image: personal-automation:latest
    restart: unless-stopped
    # Secrets come from the environment, never from the image.
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      LOG_PRETTY: "false"
      # This host has no display. Verizon requires a human sign-in at a real
      # browser, so the VM detects and notifies; you run the browser step on a
      # machine with a screen. No Chromium is installed in this image.
      BROWSER_ENABLED: "false"
    volumes:
      # SQLite ledger, OAuth tokens and downloaded bills persist here.
      - automation-data:/data
    healthcheck:
      test: ["CMD", "node", "dist/index.js", "health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    # The container never needs to escalate.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  automation-data:
